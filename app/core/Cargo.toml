[package]
name = "autowrite-core"
version = "1.0.0"
edition = "2021"

[lib]
name = "autowrite_core"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = "0.4"
regex = "1"
async-trait = "0.1"
