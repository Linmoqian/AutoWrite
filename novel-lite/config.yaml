model: qwen3:8b
timeout: 300

prompts:
  polish: |
    请对以下小说章节进行润色，要求：
    1. 修正语法错误和错别字
    2. 优化句式，使行文更流畅
    3. 丰富场景描写，增强画面感
    4. 对话更生动自然
    5. 保持原文风格和剧情不变
    6. 保持原有字数规模，不要大幅增减

    ## 原文内容
    {content}

    直接输出润色后的章节正文，保留章节标题。
  world: |
    请为一部{genre}类型的小说创建世界观设定。
    主题：{theme}
    要求：
    1. 修炼/能力体系（3-5个等级）
    2. 世界背景（势力分布、历史背景）
    3. 特色元素（2-3个独特的设定）
    4. 字数：500-800字
    直接输出世界观内容，不要有标题和额外说明。
  character: |
    基于以下世界观，创建小说角色：
    {world}
    要求创建：
    1. 主角（1人）：要有独特的金手指或优势
    2. 重要配角（2-3人）：与主角有明确关系
    每个角色包含：姓名、身份、性格、与主角关系、目标
    直接输出角色信息，用列表格式。
  outline: |
    基于以下设定，生成小说大纲：
    ## 世界观
    {world}
    ## 角色
    {characters}
    ## 要求
    - 总章数：{total_chapters}章
    - 分卷规划（每卷20-30章）
    - 每章一行，格式：章节号. 标题
    - 主线清晰，有起承转合
    直接输出大纲，按卷分组。
  chapter: |
    {context}
    ## 本章任务
    第{num}章：{title}
    ## 大纲描述
    {outline_detail}
    ## 要求
    - 字数：{words}字
    - 风格：{style}
    - 场景描写细腻，对话生动
    - 章末留悬念或转折
    直接输出章节正文内容。
